<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golden State Starlight Alliance — California Dark Sky Policy Tracker</title>
    <meta
      name="description"
      content="Tracking dark sky outdoor lighting ordinances across all 58 California counties."
    />

    <!-- Poppins, per the brand sheet: Bold for the wordmark, Medium for
         taglines and labels. preconnect first because the font is render-
         blocking for the header and a cold DNS+TLS round trip is the whole
         delay. Only the weights actually used are requested. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
