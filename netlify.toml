[build]
  # The Vite app lives in app/, not at the repo root.
  base    = "app"
  command = "npm run build"
  publish = "dist"

# Client-side routing: /county/santa-clara has no file behind it, so every
# unmatched path must fall through to index.html or a hard refresh 404s.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# GeoJSON boundaries are regenerated by a script, never edited, so they can be
# cached hard. Filenames are stable, so bump via a redeploy if data changes.
[[headers]]
  for = "/geo/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
